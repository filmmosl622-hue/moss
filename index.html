<!DOCTYPE html>
<!-- HTML : APP24/MOB -->
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Star Cinema - مشغل الفيديو</title>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;500&display=swap" rel="stylesheet">
<style type="text/css">
body {
    padding: 0;
    margin: 0;
    background: #000;
    font-family: 'Readex Pro', sans-serif;
    overflow: hidden;
}
/* حاوية المشغل لتملأ الشاشة بالكامل بدون أي أشرطة */
.player-container {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
}
video {
    width: 100%;
    height: 100%;
    object-fit: contain;
    outline: none;
    background: #000;
}
</style>
</head>
<body>

<div class="player-container">
    <!-- مشغل الفيديو المدمج يدعم الرابط المباشر الخاص بك ويملأ الشاشة -->
    <video controls autoplay playsinline controlsList="nodownload">
        <source src="https://seed306b.bitchute.com/Q3NslhDSYGTr/Zthspdi0ui39.mp4" type="video/mp4">
        متصفحك لا يدعم تشغيل الفيديو.
    </video>
</div>

</body>
</html>
