<!DOCTYPE html>
<!-- HTML : APP24/MOB -->
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Star Cinema - مشغل الفيديو</title>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
<style type="text/css">
body {
    padding: 0;
    margin: 0;
    background: #000;
    font-family: 'Readex Pro', sans-serif;
    color: #fff;
    overflow: hidden;
}
header {
    background: #26ab56;
    padding: 0 15px;
    color: #fff;
    position: fixed;
    top: 0;
    height: 60px;
    width: 100%;
    box-shadow: 0px 0px 7px black;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-sizing: border-box;
}
h3 {
    font-size: medium;
    font-weight: 500;
    margin: 0;
    color: #fff;
}
.header-btns {
    display: flex;
    gap: 5px;
}
.top-btn {
    background: rgba(255, 255, 255, 0.2);
    border: none;
    color: #fff;
    padding: 6px 10px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    display: flex;
    align-items: center;
    gap: 4px;
    text-decoration: none;
    font-family: 'Readex Pro', sans-serif;
}
.top-btn:active {
    background: rgba(0, 0, 0, 0.3);
}
/* حاوية المشغل لتملأ الشاشة باحترافية */
.player-container {
    position: absolute;
    top: 60px;
    left: 0;
    right: 0;
    bottom: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #111;
}
video {
    width: 100%;
    height: 100%;
    max-height: calc(100vh - 60px);
    outline: none;
    background: #000;
}
</style>
</head>
<body>

<header>
    <h3>مشغل الفيديو</h3>
    <div class="header-btns">
        <button class="top-btn" onclick="location.reload();">
            <i class="fa fa-refresh"></i> تحديث
        </button>
        <a href="index.html" class="top-btn">
            <i class="fa fa-arrow-left"></i> رجوع
        </a>
    </div>
</header>

<div class="player-container">
    <!-- مشغل الفيديو المدمج يدعم الرابط المباشر الخاص بك -->
    <video controls autoplay playsinline controlsList="nodownload">
        <source src="https://seed306b.bitchute.com/Q3NslhDSYGTr/Zthspdi0ui39.mp4" type="video/mp4">
        متصفحك لا يدعم تشغيل الفيديو.
    </video>
</div>

</body>
</html>
